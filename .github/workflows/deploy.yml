name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 临时诊断（2026-09-02）：本地全绿但 CI 1 秒崩，拆 pretest/test 拿 Linux 真实错误。
      # 拿到错误修复后，恢复为 `npm test`（阻塞门禁）并删除诊断日志收集。
      - name: Run pretest (i18n gate) — capture Linux errors
        continue-on-error: true
        run: |
          npm run pretest > _ci-pretest.log 2>&1
          echo "=== pretest exit=$? ==="
          cat _ci-pretest.log
      - name: Run tests — capture Linux errors
        continue-on-error: true
        run: |
          node --test "tests/*.test.mjs" > _ci-test.log 2>&1
          echo "=== test exit=$? ==="
          tail -120 _ci-test.log
      - run: npm run build
      - name: Stash CI diagnostics to dist (after build so dist exists and isn't wiped)
        run: |
          mkdir -p dist/_ci
          cp _ci-pretest.log dist/_ci/pretest.log 2>/dev/null || echo "no log" > dist/_ci/pretest.log
          cp _ci-test.log dist/_ci/test.log 2>/dev/null || echo "no log" > dist/_ci/test.log
          echo "pretest size: $(wc -c < dist/_ci/pretest.log)"
          echo "test size: $(wc -c < dist/_ci/test.log)"
      - name: Build paper static pages
        # 将 paper/*.md 渲染为自包含 HTML，部署到 /paper（中文）与 /paper-en（英文）。
        # continue-on-error 作为安全网：论文渲染失败时仍保证主应用正常上线。
        continue-on-error: true
        run: node paper/build-paper.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4