name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 本地开发/测试使用的是 Node 24.12；CI 长期锁死 Node 20 导致
          # ESM loader / npm lifecycle 行为差异（如 fake-indexeddb@6 模块、
          # dynamic import() 时序）——本地通过但 CI 1 秒崩的根因。
          # 升级到 Node 24 与本地保持一致，从根本上消除跨版本差异。
          node-version: 24
          cache: npm
      - run: npm ci
      # 门禁：同步/SRS/英语模块/算法回归测试失败则不构建不发布。
      #
      # 根治说明（最终闭环 Run #69 验证）：
      #  1. Node 版本：CI 与本地一致使用 Node 24（见 setup-node 注释）。
      #     原先 CI 锁 Node 20 与本地 Node 24.12 差异导致 pretest/test 1 秒崩
      #     （#46-#68 连续 23 次失败）。
      #  2. scripts.test：用 && 显式串行 i18n 严格闸 + i18n JS 闸 + tests，
      #     而不依赖 npm lifecycle 的 pretest 钩子。是因为 npm lifecycle
      #     在某些版本下父子进程 stdout/stderr 缓冲与时序不同步，导致
      #     CI 上偶发非确定性失败。
      #  3. --test-concurrency=1：强制 81 个测试文件串行执行，
      #     堵住 fake-indexeddb@6 + dexie 在不同子进程同时 import 时
      #     全局状态竞争导致的偶发 test 失败。
      - run: npm test
      - run: npm run build
      - name: Build paper static pages
        # 将 paper/*.md 渲染为自包含 HTML，部署到 /paper（中文）与 /paper-en（英文）。
        # continue-on-error 作为安全网：论文渲染失败时仍保证主应用正常上线。
        continue-on-error: true
        run: node paper/build-paper.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4