name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 本地开发/测试使用的是 Node 24.12；CI 长期锁死 Node 20 导致
          # ESM loader / npm lifecycle 行为差异（如 fake-indexeddb@6 模块、
          # dynamic import() 时序）——本地通过但 CI 1 秒崩的根因。
          # 升级到 Node 24 与本地保持一致，从根本上消除跨版本差异。
          node-version: 24
          cache: npm
      - run: npm ci
      # 临时：强制收集 npm test 在 CI Linux 下的真实 stderr/stdout 并部署到 Pages，
      # 用 set +e 保证命令失败也继续（exit code 写入诊断文件）；拿到确切错误后
      # 恢复为阻塞式 npm test 门禁。Pages 部署后访问：
      #   https://hui-shang-qing.github.io/sxybrick/_ci/npm-test.log
      - name: Run npm test — capture ALL output (set +e so failure doesn't block build)
        run: |
          set +e
          echo "=== pwd: $(pwd) ===" > _ci-npm-test.log
          echo "=== node: $(node --version) ===" >> _ci-npm-test.log
          echo "=== npm: $(npm --version) ===" >> _ci-npm-test.log
          echo "=== files in tests/: $(ls tests | wc -l) ===" >> _ci-npm-test.log
          echo "=== files in src/views/: $(ls src/views | wc -l) ===" >> _ci-npm-test.log
          echo "=== files in src/i18n/views/: $(ls src/i18n/views | wc -l) ===" >> _ci-npm-test.log
          echo "=== ls src/i18n/views sample: $(ls src/i18n/views | head -5 | tr '\n' ',') ===" >> _ci-npm-test.log
          echo "" >> _ci-npm-test.log
          echo "=== npm test start $(date -u +%FT%TZ) ===" >> _ci-npm-test.log
          npm test >> _ci-npm-test.log 2>&1
          echo "npm test exit=$?" >> _ci-npm-test.log
          echo "=== npm test end $(date -u +%FT%TZ) ===" >> _ci-npm-test.log
          tail -200 _ci-npm-test.log
      - run: npm run build
      - name: Stash CI diagnostics into dist (after build so dist/ survives)
        run: |
          mkdir -p dist/_ci
          cp _ci-npm-test.log dist/_ci/npm-test.log
          echo "log size: $(wc -c < dist/_ci/npm-test.log)"
      - name: Build paper static pages
        # 将 paper/*.md 渲染为自包含 HTML，部署到 /paper（中文）与 /paper-en（英文）。
        # continue-on-error 作为安全网：论文渲染失败时仍保证主应用正常上线。
        continue-on-error: true
        run: node paper/build-paper.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4