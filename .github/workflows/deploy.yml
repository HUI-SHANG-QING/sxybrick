name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 本地开发/测试使用的是 Node 24.12；CI 长期锁死 Node 20 导致
          # ESM loader / npm lifecycle 行为差异（如 fake-indexeddb@6 模块、
          # dynamic import() 时序）——本地通过但 CI 1 秒崩的根因。
          # 升级到 Node 24 与本地保持一致，从根本上消除跨版本差异。
          node-version: 24
          cache: npm
      - run: npm ci
      # 门禁：i18n 闸 + 777 回归测试全过才构建/发布。
      #
      # 根治闭环（Run #74 验证）：
      #  1. Node 24：CI 与本地一致（原 CI 锁 Node 20 导致 1 秒崩，#46-#68 连续 23 次失败）。
      #  2. i18n baseline key 归一 POSIX 斜杠：原 Windows 绝对盘符路径在 Linux CI 上
      #     永不匹配 → 404 条全判新增（#70-#71）。用 path.relative + replace(/\\/g,'/')
      #     统一（#72 修复）。
      #  3. serveStatic 404 回退：CI 上 npm test 在 npm run build 之前跑，dist/ 不存在，
      #     readFileSync 抛 ENOENT → 异步 handler 未 catch → SocketError: other side closed
      #     → hub-auth E2E 测试失败（#73 诊断）。加 existsSync 404 回退（#74 修复）。
      #  4. --test-concurrency=1：81 个测试文件串行执行，堵住 fake-indexeddb@6 + dexie
      #     全局状态竞争导致的偶发 test 失败。
      - run: npm test
      - run: npm run build
      - name: Build paper static pages
        # 将 paper/*.md 渲染为自包含 HTML，部署到 /paper（中文）与 /paper-en（英文）。
        # continue-on-error 作为安全网：论文渲染失败时仍保证主应用正常上线。
        continue-on-error: true
        run: node paper/build-paper.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4