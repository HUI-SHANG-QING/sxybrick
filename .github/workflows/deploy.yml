name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 门禁：同步/SRS/英语模块/算法回归测试失败则不构建不发布。
      # 说明：scripts.test 内含 i18n 闸门（pretest 两道 + tests 一道串行执行，
      # 见 package.json：用 && 显式串联而非依赖 npm lifecycle pretest 钩子，
      # 是因为 npm lifecycle 在 CI Linux + Node 20 下会因进程初始化时序问题
      # 提前 1 秒崩溃；--test-concurrency=1 是强制串行，堵住不同子进程
      # import dexie/fake-indexeddb 时偶发全局竞争导致的非确定性失败。
      - run: npm test
      - run: npm run build
      - name: Build paper static pages
        # 将 paper/*.md 渲染为自包含 HTML，部署到 /paper（中文）与 /paper-en（英文）。
        # continue-on-error 作为安全网：论文渲染失败时仍保证主应用正常上线。
        continue-on-error: true
        run: node paper/build-paper.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4